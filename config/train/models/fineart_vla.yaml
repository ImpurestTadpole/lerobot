# FineART-VLA: pi0.5-based, also trains a language head. Same micro-batch as pi05 (24 GB 3090 Ti).
# Base checkpoint already uses 14-dim state/action and 360x640 cameras.
policy.path: lerobot/fineart_vla_base
policy.dtype: bfloat16
policy.gradient_checkpointing: true
policy.optimizer_lr: 2.5e-5
batch_size: 4
accelerator.gradient_accumulation.steps: 8
rename_map: '{"observation.images.head": "observation.images.cam_high", "observation.images.left_wrist": "observation.images.cam_left_wrist", "observation.images.right_wrist": "observation.images.cam_right_wrist"}'
