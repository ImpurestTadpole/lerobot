# LaWAM (latent world action model, Qwen3-VL-2B). Checkpoint takes 2 cameras (image, image2) and a
# 32-dim padded action/state space; the right wrist camera is not used.
policy.path: jialei02/lawam-pretrain-lerobot
policy.action_horizon: 16
policy.n_action_steps: 16
policy.optimizer_lr: 1e-4
batch_size: 8
accelerator.gradient_accumulation.steps: 4
rename_map: '{"observation.images.head": "observation.images.image", "observation.images.left_wrist": "observation.images.image2"}'
