# pi0.5 (default). Micro-batch is a starting point for the 24 GB RTX 3090 Ti: probe it
# (MODEL=pi05 STAGE=probe scripts/pc1/train.sh) and raise/lower before a long run.
# Effective batch = batch_size x accelerator.gradient_accumulation.steps (target 32).
policy.path: lerobot/pi05_base
policy.dtype: bfloat16
policy.gradient_checkpointing: true
policy.train_expert_only: true   # frozen VLM; the choice noted in docs/generalist_merge_resume.md
batch_size: 4
accelerator.gradient_accumulation.steps: 8
policy.optimizer_lr: 2.5e-5
# pi05_base expects these camera names; our EE datasets use head/left_wrist/right_wrist.
# The same mapping must be passed at rollout so the checkpoint sees the names it was trained with.
rename_map: '{"observation.images.head": "observation.images.base_0_rgb", "observation.images.left_wrist": "observation.images.left_wrist_0_rgb", "observation.images.right_wrist": "observation.images.right_wrist_0_rgb"}'
