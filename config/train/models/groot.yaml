# GR00T N1.7 3B: the NVIDIA checkpoint is not in LeRobot format, so it loads via
# policy.type + base_model_path, not policy.path. 3B needs a small micro-batch on 24 GB;
# verify with the probe stage first. For stage 2, set INIT_CKPT only after changing
# build_train_args.py to map it to policy.path for groot.
policy.type: groot
policy.base_model_path: nvidia/GR00T-N1.7-3B
policy.embodiment_tag: new_embodiment
policy.use_bf16: true
batch_size: 2
accelerator.gradient_accumulation.steps: 16
policy.optimizer_lr: 1e-4
